<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo morado de fondo (color-accent del DS). -->
  <circle cx="10" cy="10" r="10" fill="#8B5B87"/>
  <!-- Logo "in" de LinkedIn en blanco, centrado dentro del círculo
       (inset 25% según el Figma node 615:613). Los paths originales
       del logo están en viewBox 24×24, así que aplicamos
       translate(5,5) + scale(10/24 ≈ 0.4167) para llevarlos a la
       zona central de 10×10 dentro del círculo de 20×20. -->
  <g transform="translate(5 5) scale(0.4167)" fill="#FFFFFF">
    <!-- "n" de LinkedIn -->
    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286z"/>
    <!-- Punto de la "i" -->
    <circle cx="5.337" cy="5.368" r="2.063"/>
    <!-- Línea vertical de la "i" -->
    <rect x="3.555" y="9" width="3.564" height="11.452"/>
  </g>
</svg>
