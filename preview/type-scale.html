<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 20px 28px; background: var(--bg-1); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: 128px 1fr; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid var(--border-2); column-gap: 20px; }
  .row:last-child { border: 0; }
  .label { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .spec { color: var(--fg-1); letter-spacing: -0.02em; font-weight: 500; font-family: "Neue Montreal", Inter, sans-serif; }
</style>
</head>
<body>
  <div class="row"><div class="label">Headline 48</div>
    <div class="spec" style="font-size:48px;line-height:1.05;">Let's talk!</div></div>
  <div class="row"><div class="label">Title 32</div>
    <div class="spec" style="font-size:32px;line-height:1.1;">Explore my work</div></div>
  <div class="row"><div class="label">H4 — 20</div>
    <div class="spec" style="font-size:20px;line-height:1.4;">Aumenté la conversión en una experiencia 3D</div></div>
  <div class="row"><div class="label">Body 16</div>
    <div class="spec" style="font-size:16px;line-height:1.75;font-weight:400;color:var(--fg-2);">UX/UI & Product Designer de Argentina.</div></div>
  <div class="row"><div class="label">Small 14</div>
    <div class="spec" style="font-size:14px;line-height:1.43;font-weight:400;color:var(--fg-2);">Diseño aplicaciones mobile y plataformas web.</div></div>
  <div class="row"><div class="label">Bold Italic</div>
    <div class="spec" style="font-size:22px;font-weight:700;font-style:italic;color:var(--color-accent);">Bold italic — product designer</div></div>
</body>
</html>
