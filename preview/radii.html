<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .swatch { width: 120px; height: 44px; background: var(--color-accent); }
  .lbl { font-size: 12px; color: var(--fg-2); }
  .lbl b { display: block; color: var(--fg-1); font-weight: 500; font-size: 13px; }
  .pill { border-radius: 100px; }
  .sq { border-radius: 0; }
  .slight { border-radius: 2px; }
  .md { border-radius: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="swatch sq"></div><div class="lbl"><b>0 · square</b>cards, images, tag chips</div></div>
    <div class="cell"><div class="swatch slight"></div><div class="lbl"><b>2 · slight</b>specimen sheets, rare</div></div>
    <div class="cell"><div class="swatch md"></div><div class="lbl"><b>8 · md</b>reserved (rare)</div></div>
    <div class="cell"><div class="swatch pill"></div><div class="lbl"><b>100 · pill</b>all buttons & tags</div></div>
  </div>
</body>
</html>
