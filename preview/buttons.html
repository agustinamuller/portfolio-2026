<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
    border-radius: 100px; font-weight: 500; font-size: 18px; line-height: 32px;
    border: 1px solid transparent; cursor: pointer; font-family: var(--font-sans);
  }
  .btn-primary { background: var(--color-accent); color: #fafafa; }
  .btn-primary.hover { background: transparent; border-color: var(--fg-1); color: var(--fg-1); }
  .btn-ghost { background: transparent; color: var(--fg-1); padding: 4px 10px; }
  .lbl { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; width: 70px; }
</style>
</head>
<body>
  <div class="row">
    <span class="lbl">primary</span>
    <button class="btn btn-primary">let's talk
      <img src="../assets/arrow-icon-light.svg" width="18" height="18" style="display:inline-block">
    </button>
    <button class="btn btn-primary hover">let's talk
      <img src="../assets/arrow-icon-dark.svg" width="20" height="20" style="display:inline-block;filter:invert(1) brightness(0)">
    </button>
    <button class="btn btn-primary">ver proyecto
      <img src="../assets/arrow-icon-light.svg" width="18" height="18" style="display:inline-block">
    </button>
  </div>
  <div class="row">
    <span class="lbl">ghost</span>
    <button class="btn btn-ghost">work</button>
    <button class="btn btn-ghost">about me</button>
  </div>
</body>
</html>
