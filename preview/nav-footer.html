<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); font-family: var(--font-sans); }
  .nav {
    width: 100%; background: var(--bg-1); padding: 20px 48px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border-2);
  }
  .logo { font-family: var(--font-display); font-weight: 500; font-size: 20px; color: var(--fg-1); letter-spacing: -0.01em; }
  .links { display: flex; gap: 28px; align-items: center; }
  .links a { font-size: 16px; color: var(--fg-1); font-weight: 500; padding: 4px 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 100px; background: var(--color-accent); color: #fafafa;
    font-weight: 500; font-size: 16px;
  }
  .footer {
    padding: 40px 48px 24px; text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center;
    border-top: 1px solid var(--border-2);
  }
  .ft-title { font-family: var(--font-display); font-weight: 500; font-size: 40px; color: var(--fg-1); letter-spacing: -0.02em; }
  .mail { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; font-size: 18px; color: var(--fg-1); }
  .copy { font-size: 14px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="nav">
    <div class="logo">agustina müller</div>
    <div class="links">
      <a>work</a><a>about me</a>
      <a class="btn">let's talk
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 11 L11 3 M5 3 H11 V9" stroke="#fafafa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>
  <div class="footer">
    <div class="ft-title">Let's talk!</div>
    <div class="mail">✉ magustinamuller@gmail.com</div>
    <div class="copy">Agustina Müller © 2025</div>
  </div>
</body>
</html>
