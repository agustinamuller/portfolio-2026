<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 18px; padding: 10px 0; border-bottom: 1px solid var(--border-2); }
  .row:last-child { border: 0; }
  .lbl { width: 90px; font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .bar { height: 10px; background: var(--color-accent); border-radius: 0; }
  .val { width: 52px; text-align: right; font-size: 12px; color: var(--fg-2); font-feature-settings: "tnum"; }
</style>
</head>
<body>
  <div class="row"><div class="lbl">4 — 1</div><div class="bar" style="width:4px"></div><div class="val">4px</div></div>
  <div class="row"><div class="lbl">8 — 2</div><div class="bar" style="width:8px"></div><div class="val">8px</div></div>
  <div class="row"><div class="lbl">12 — 3</div><div class="bar" style="width:12px"></div><div class="val">12px</div></div>
  <div class="row"><div class="lbl">16 — 4</div><div class="bar" style="width:16px"></div><div class="val">16px</div></div>
  <div class="row"><div class="lbl">24 — 5</div><div class="bar" style="width:24px"></div><div class="val">24px</div></div>
  <div class="row"><div class="lbl">32 — 6</div><div class="bar" style="width:32px"></div><div class="val">32px</div></div>
  <div class="row"><div class="lbl">48 — 7</div><div class="bar" style="width:48px"></div><div class="val">48px</div></div>
  <div class="row"><div class="lbl">56 — 8</div><div class="bar" style="width:56px"></div><div class="val">56px</div></div>
  <div class="row"><div class="lbl">72 — 9</div><div class="bar" style="width:72px"></div><div class="val">72px</div></div>
  <div class="row"><div class="lbl">96 — 10</div><div class="bar" style="width:96px"></div><div class="val">96px</div></div>
  <div class="row"><div class="lbl">112 — 11</div><div class="bar" style="width:112px"></div><div class="val">112px</div></div>
</body>
</html>
