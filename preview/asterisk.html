<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-sans); }
  .wrap { display: flex; flex-wrap: wrap; gap: 18px 36px; align-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ast { font-family: var(--font-accent); font-style: italic; color: var(--color-accent); line-height: 1; }
  .lbl { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cell"><span class="ast" style="font-size:24px;">*</span><span class="lbl">inline · 24</span></div>
    <div class="cell"><span class="ast" style="font-size:40px;">*</span><span class="lbl">tag · 40</span></div>
    <div class="cell"><span class="ast" style="font-size:82px;">*</span><span class="lbl">hero · 82</span></div>
    <div class="cell"><span class="ast" style="font-size:120px;">*</span><span class="lbl">display · 120</span></div>
  </div>
</body>
</html>
