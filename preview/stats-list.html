<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 24px; background: var(--bg-1); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .eye { color: var(--color-accent); font-weight: 500; font-size: 14px; line-height: 1.75; text-transform: uppercase; letter-spacing: 0.02em; }
  .items { font-family: var(--font-display); font-size: 17px; line-height: 28px; color: var(--fg-1); font-weight: 400; }
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <div class="eye">Services</div>
      <div class="items">Product Design<br>UX &amp; Strategy<br>App Design<br>Web Design<br>UI &amp; Design Systems</div>
    </div>
    <div class="col">
      <div class="eye">Experience</div>
      <div class="items">5+ Years<br>Product Designer<br>UX/UI Designer</div>
    </div>
    <div class="col">
      <div class="eye">Industry</div>
      <div class="items">SaaS B2B &amp; B2C<br>Fintech<br>E-commerce<br>Mobile</div>
    </div>
  </div>
</body>
</html>
