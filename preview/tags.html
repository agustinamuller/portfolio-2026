<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 28px; background: var(--bg-1); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; align-items: center; flex-wrap: wrap; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 12px 16px; border: 1px solid var(--border-1);
    font-weight: 500; font-size: 16px; line-height: 28px; color: var(--fg-1);
    background: var(--bg-1);
  }
  .ast { font-family: var(--font-accent); font-style: italic; color: var(--color-accent); font-size: 24px; line-height: 1; }
  .catpill { display:inline-block; padding: 4px 2px; color: var(--color-accent); font-weight: 500; font-size: 16px; line-height: 1.4; margin-right: 14px; }
  .yearpill { display:inline-block; padding: 4px 2px; color: var(--fg-2); font-weight: 500; font-size: 16px; line-height: 1.4; margin-right: 14px; }
  .lbl { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .grp { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
  <div class="grp">
    <div>
      <div class="lbl">Category item (bordered)</div>
      <div class="row">
        <span class="tag"><span class="ast">*</span> Product design</span>
        <span class="tag"><span class="ast">*</span> Web design</span>
      </div>
    </div>
    <div>
      <div class="lbl">Tags — year + category</div>
      <div class="row">
        <span class="yearpill">2025</span>
        <span class="catpill">FINTECH</span>
        <span class="catpill">MOBILE</span>
        <span class="catpill">B2C</span>
      </div>
    </div>
  </div>
</body>
</html>
