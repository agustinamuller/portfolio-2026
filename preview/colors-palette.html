<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 20px; background: var(--bg-1); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 72px; border-radius: 2px; border: 1px solid var(--border-2); }
  .lbl { font-size: 12px; color: var(--fg-2); line-height: 1.3; font-family: var(--font-sans); }
  .nm { font-weight: 500; color: var(--fg-1); }
  .hex { color: var(--fg-3); font-feature-settings: "tnum"; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:rgb(250,250,250)"></div><div class="lbl"><div class="nm">bg / 50</div><div class="hex">#fafafa</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(246,246,246)"></div><div class="lbl"><div class="nm">bg-muted</div><div class="hex">#f6f6f6</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(224,224,224)"></div><div class="lbl"><div class="nm">placeholder</div><div class="hex">#e0e0e0</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(219,219,219)"></div><div class="lbl"><div class="nm">border-soft</div><div class="hex">#dbdbdb</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(173,173,184)"></div><div class="lbl"><div class="nm">border</div><div class="hex">#adadb8</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(156,156,156)"></div><div class="lbl"><div class="nm">fg-soft</div><div class="hex">#9c9c9c</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(87,88,96)"></div><div class="lbl"><div class="nm">fg-mid</div><div class="hex">#575860</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(39,39,43)"></div><div class="lbl"><div class="nm">fg-body</div><div class="hex">#27272b</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(19,19,22)"></div><div class="lbl"><div class="nm">ink</div><div class="hex">#131316</div></div></div>
    <div class="sw"><div class="chip" style="background:rgb(139,91,135)"></div><div class="lbl"><div class="nm">accent</div><div class="hex">#8b5b87</div></div></div>
  </div>
</body>
</html>
